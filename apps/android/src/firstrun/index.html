<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>qinqin</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<main>
			<h1 id="title"></h1>
			<p id="intro"></p>
			<form id="form" novalidate>
				<label for="address" id="address-label"></label>
				<input id="address" name="address" type="text" inputmode="url" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="hint problem" />
				<p id="hint" class="hint"></p>
				<p id="problem" class="problem" role="alert" hidden></p>
				<button id="connect" type="submit" class="primary"></button>
			</form>
			<div id="status" role="status" aria-live="polite"></div>
			<section id="notes" aria-live="polite"></section>
			<div id="actions" class="actions"></div>
		</main>
		<script type="module" src="./main.js"></script>
	</body>
</html>
