name: images-stage

# Builds only the Dockerfile's `images` stage (the pinned OpenMoji and Mulberry downloads,
# their SHA-256 checks and the two pictures packs; no push) so a broken pin or a moved
# upstream file shows up on a pull request or in the weekly run instead of on release day.
# Fallback for a release while it is red: build with `--build-arg WITH_IMAGES=0` (the image
# then has no pictures, nothing else changes).

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/**
      - scripts/images/**
      - scripts/images-*
      - scripts/prepare-images-pack.mjs
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the images stage
        run: docker build --target images -t qinqin-images-stage .
      - name: Check the packs it produced
        run: |
          docker run --rm --entrypoint sh qinqin-images-stage -c \
            'for p in openmoji mulberry; do test -s /out/images-$p/manifest.json && test -s /out/images-$p/map.tsv && echo "$p: $(ls /out/images-$p/pictures | wc -l) pictures"; done'
