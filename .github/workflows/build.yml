name: build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# Least privilege by default; the image job asks for packages: write itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Cheap consistency checks first; they use the setup-node Node above and
      # need no install, network or data download.
      - name: Check sources and script tests
        run: |
          node scripts/check-sources.mjs
          node --test scripts/*.test.mjs
      # Committed seed archives are readable and match the checksum manifest.
      - name: Check seed archives
        run: scripts/check-archives.sh
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check and test web
        working-directory: apps/web
        run: |
          npm run check
          npm test
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The journal's offline OCR test must run for real in CI: with
      # QINQIN_REQUIRE_TESSERACT=1 a missing binary fails it instead of skipping.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Vet and test Go
        working-directory: server
        env:
          QINQIN_REQUIRE_TESSERACT: "1"
        run: |
          go vet ./...
          go test ./...
      - name: Build web
        working-directory: apps/web
        run: npm run build
      # The unit tests serve fstest.MapFS; this builds the real binary with the
      # real SPA embedded (as the Dockerfile does) and asserts through HTTP:
      # index, deep link, hashed asset, stroke data, licence text, headers.
      - name: Embed smoke test
        run: scripts/smoke-embed.sh

  image:
    needs: test
    # Develop pushes are test-only; images publish from main and release tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
