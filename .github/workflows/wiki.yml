name: wiki

# Publishes docs/wiki to the repository's GitHub wiki (<repo>.wiki.git).
# - Runs on every push to main that changes docs/wiki.
# - "Run workflow" (workflow_dispatch) publishes the docs/wiki of the branch
#   it is started on, so the owner can publish from develop or a docs branch.
# Needs the repository secret WIKI_TOKEN (a fine-grained token with Contents
# write on this repository, or a GitHub App token). Without it the job prints
# a notice and succeeds without publishing. See docs/wiki/README.md.

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the WIKI_TOKEN secret
        id: token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::notice title=Wiki not published::The WIKI_TOKEN secret is not set, so the wiki was not published. Add it under Settings, Secrets and variables, Actions (see docs/wiki/README.md), then run this workflow again."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
      - name: Push docs/wiki to the wiki repository
        if: steps.token.outputs.present == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git --exclude README.md docs/wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
          else
            git commit -m "docs: update wiki from docs/wiki at ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
            git push
          fi
