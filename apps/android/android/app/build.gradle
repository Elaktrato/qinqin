apply plugin: 'com.android.application'

// The package id, the launcher name and the version come from one place each: identity.json (a PLACEHOLDER the
// owner confirms before the first release) and package.json.
def identity = new groovy.json.JsonSlurper().parse(file('../../identity.json'))
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))

android {
    // The code's package; independent of the application id, which can change here without touching code.
    namespace = "qinqin.shell"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId identity.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Release builds pass both from the tag (apps/android/scripts/version-code.mjs, #148); a local or debug
        // build gets package.json's version and code 1.
        versionCode Integer.parseInt((findProperty('qinqinVersionCode') ?: '1').toString())
        versionName((findProperty('qinqinVersionName') ?: pkg.version).toString())
        resValue "string", "app_name", identity.appName
        resValue "string", "app_id", identity.appId
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing exists only when the four environment variables are all set (the release workflow sets them
    // from repository secrets, the keystore decoded to a temporary file). No variables: the release APK is
    // unsigned, and nothing here ever names a key, a password or a keystore path.
    def keystoreFile = System.getenv('QINQIN_KEYSTORE_FILE')
    def signingEnv = ['QINQIN_KEYSTORE_FILE', 'QINQIN_KEYSTORE_PASSWORD', 'QINQIN_KEY_ALIAS', 'QINQIN_KEY_PASSWORD']
    def canSign = signingEnv.every { !(System.getenv(it) ?: '').isEmpty() }
    if (canSign) {
        signingConfigs {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('QINQIN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('QINQIN_KEY_ALIAS')
                keyPassword System.getenv('QINQIN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (canSign) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
