name: android-apk

# The Android APK for sideloading (#148). Two ways in:
#   - build.yml calls it with release: true for every v* tag. That build is SIGNED with the release key and fails
#     (never publishes unsigned) when a secret is missing, the signature does not verify, or the certificate is not
#     the pinned one. The signing job runs in the GitHub environment `android-release`, so the secrets can be limited
#     to v* tags there. build.yml's release job attaches the result to the GitHub release.
#   - Run it by hand (workflow_dispatch) to test the pipeline: a debug-signed APK as a workflow artifact only. It
#     never reads a secret, never signs with the release key and never touches a release.
# Secrets (set by the owner, see docs/superpowers/plans/2026-11-25-android-release-apk.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Variable (public, optional): ANDROID_CERT_SHA256, the signing certificate's SHA-256 fingerprint. When set, a
# release whose certificate differs fails.
# The build steps are in .github/actions/android-apk (shared by the dry run and the release job).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, semver with or without v (a dry run, not a release)"
        required: false
        default: "0.0.0-rc.1"
  workflow_call:
    inputs:
      version:
        description: "The release tag (vMAJOR.MINOR.PATCH[-pre])"
        required: true
        type: string
      release:
        description: "true: sign with the release key (a v* tag only); false: a debug-signed dry run"
        required: false
        default: false
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  # The dry run: a debug-signed APK as an artifact, no secret, no environment.
  dryrun:
    # Never on a fork: a fork has no secrets and must not build "releases" under the project's name.
    if: github.repository == 'Elaktrato/qinqin' && inputs.release != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-apk
        with:
          version: ${{ inputs.version }}
          release: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/
          retention-days: 14
          if-no-files-found: error

  # The signed release. The environment gates the secrets: the owner restricts it to v* tags (and may add required
  # reviewers), so a workflow on any other branch cannot read them. Until the secrets are moved into the
  # environment, repository-level secrets, passed by build.yml, keep working.
  release:
    if: github.repository == 'Elaktrato/qinqin' && inputs.release == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v7
      # Signing happens only for a release tag. A "release" requested from any other ref is a mistake: stop.
      - name: Check what is being built
        env:
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::a signed release APK is built only for a v* tag, not $REF"; exit 1 ;;
          esac
          if [ "$INPUT_VERSION" != "${REF#refs/tags/}" ]; then
            echo "::error::version input $INPUT_VERSION is not the tag ${REF#refs/tags/}"
            exit 1
          fi
      - uses: ./.github/actions/android-apk
        with:
          version: ${{ inputs.version }}
          release: "true"
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          expected-cert-sha256: ${{ vars.ANDROID_CERT_SHA256 }}
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/
          retention-days: 7
          if-no-files-found: error
