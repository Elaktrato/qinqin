name: build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# Least privilege by default; the image job asks for packages: write itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/android/package-lock.json
      # Cheap consistency checks first; they use the setup-node Node above and
      # need no install, network or data download.
      - name: Check sources and script tests
        run: |
          node scripts/check-sources.mjs
          node --test scripts/*.test.mjs
      # Committed seed archives are readable and match the checksum manifest.
      - name: Check seed archives
        run: scripts/check-archives.sh
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check and test web
        working-directory: apps/web
        run: |
          npm run check
          npm test
      # The Android shell's first-run screen (TypeScript, jsdom): cheap, no Android SDK needed. Its Java unit tests
      # run in the android-emulator workflow (./gradlew testDebugUnitTest).
      - name: Check and test the Android first-run screen
        working-directory: apps/android
        run: |
          npm ci
          npm test
          npm run check
      # The font pack script's build test needs its subsetter (a build-time
      # tool of the script only) and opencc-js from the web install above;
      # without them the first script test run skips it.
      - name: Font pack script
        run: |
          npm --prefix scripts/fonts ci
          node --test scripts/prepare-font-pack.test.mjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The journal's offline OCR test must run for real in CI: with
      # QINQIN_REQUIRE_TESSERACT=1 a missing binary fails it instead of skipping.
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Vet and test Go
        working-directory: server
        env:
          QINQIN_REQUIRE_TESSERACT: "1"
        run: |
          go vet ./...
          go test ./...
      - name: Build web
        working-directory: apps/web
        run: npm run build
      # The unit tests serve fstest.MapFS; this builds the real binary with the
      # real SPA embedded (as the Dockerfile does) and asserts through HTTP:
      # index, deep link, hashed asset, stroke data, licence text, headers.
      - name: Embed smoke test
        run: scripts/smoke-embed.sh

  # Browser end-to-end tests (#157, apps/web/e2e): the real binary with the
  # built SPA embedded, one throw-away data directory and port per worker,
  # Chromium only. Runs beside `test`; a failure blocks like a unit test.
  # Traces, screenshots, videos, the HTML report and the server logs are
  # uploaded only when it fails, for 7 days.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      # The browser of the pinned @playwright/test version: cached per version;
      # its system libraries are installed every time (they are not cached).
      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        working-directory: apps/web
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium
      - name: Build web
        working-directory: apps/web
        run: npm run build
      # The global setup builds the binary from server/ with this build embedded
      # (QINQIN_E2E_REUSE_BUILD: the web build above, not a second one).
      - name: End-to-end tests
        working-directory: apps/web
        env:
          QINQIN_E2E_REUSE_BUILD: "1"
        run: npm run e2e
      - name: Upload the failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            apps/web/e2e/test-results/
            apps/web/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  image:
    needs: [test, e2e]
    # Develop pushes are test-only; images publish from main and release tags.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build metadata (#154): the tag without its v on a release build, "dev"
      # otherwise; the commit; the commit's date in UTC (the same for every
      # rebuild of one commit).
      - id: build
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=dev
          case "$REF" in refs/tags/v*) version="${REF_NAME#v}" ;; esac
          # A release tag must be semver (v0.7.0, v0.7.0-rc.1): anything else would publish an image that
          # reports a version the update check cannot compare. Fail here, not silently later.
          if [ "$version" != dev ] && ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $REF_NAME is not semver (vMAJOR.MINOR.PATCH[-pre])"
            exit 1
          fi
          date=$(date -u -d "$(git show -s --format=%cI HEAD)" +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "version=$version"
            echo "date=$date"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      # The default build includes the Kanji alive audio pack (WITH_AUDIO=1): each
      # release build without a warm layer cache downloads about 69 MB from
      # media.kanjialive.com and the image grows by about 70 MB. The audio-stage
      # workflow builds that stage on PRs and weekly, so a break shows early. If the
      # download fails on release day, add `build-args: WITH_AUDIO=0` to leave it out.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The signed Android APK of a release tag (#148), built by the reusable android-apk workflow with the release key
  # from the repository secrets. It never runs on a fork (the called workflow also checks the repository). A tag
  # whose APK cannot be built or signed publishes no release: an incomplete release is worse than none.
  android:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'Elaktrato/qinqin'
    uses: ./.github/workflows/android-apk.yml
    with:
      version: ${{ github.ref_name }}
      release: true
    secrets: inherit

  # A GitHub Release for every v* tag, after the image is pushed and the APK is built. The body is
  # docs/releases/<tag>.md when that file exists, else GitHub's generated
  # notes. Tags with a hyphen (v0.5.0-rc1) become pre-releases. The APK and its SHA-256 file are attached
  # (replaced when the job is re-run). On a fork there is no APK job, so the release is created without one.
  release:
    needs: [image, android]
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      && needs.image.result == 'success'
      && (needs.android.result == 'success' || (needs.android.result == 'skipped' && github.repository != 'Elaktrato/qinqin'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.android.result == 'success'
        with:
          name: android-apk
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            args=(--verify-tag --title "qinqin $TAG")
            if [ -f "docs/releases/$TAG.md" ]; then
              args+=(--notes-file "docs/releases/$TAG.md")
            else
              args+=(--generate-notes)
            fi
            case "$TAG" in *-*) args+=(--prerelease) ;; esac
            gh release create "$TAG" "${args[@]}"
          fi
          if [ -d dist ]; then
            # qinqin-<version>.apk and qinqin-<version>.apk.sha256 (sha256sum format)
            gh release upload "$TAG" dist/qinqin-*.apk dist/qinqin-*.apk.sha256 --clobber
          fi
