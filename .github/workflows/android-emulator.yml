name: android-emulator

# The Android shell in a real emulator (#35): the offline start from the service worker, an airplane-mode study
# session whose reviews sync exactly once, and the WebView's storage numbers. The emulator needs KVM, which the
# development machine lacks, so this job is where those checks run. It is slow (build + emulator, see the run
# time in the job summary), so it runs only for a change to the shell, to the web app's door to it, or to what
# the offline and study checks exercise (the service worker, lib/pwa, the study logic and outbox, the back-button
# overlay code), or by hand. It also runs the shell's Java unit tests (testDebugUnitTest).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/web/src/lib/native/**"
      - "apps/web/src/service-worker.ts"
      - "apps/web/src/lib/pwa/**"
      - "apps/web/src/lib/study/**"
      - "apps/web/src/lib/ui/dismissStack*"
      - "apps/web/src/lib/ui/modal*"
      - ".github/workflows/android-emulator.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/android/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The server: the real binary with the real SPA embedded (as the Dockerfile and scripts/smoke-embed.sh do).
      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Build server
        run: apps/android/e2e/build-server.sh "$RUNNER_TEMP/qinqin"

      # The app: the first-run screen, cap sync, the debug APK.
      - name: Build debug APK
        working-directory: apps/android
        run: |
          npm ci
          npm run sync
          cd android
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Locate the APK
        run: echo "APK=$(realpath apps/android/android/app/build/outputs/apk/debug/app-debug.apk)" >> "$GITHUB_ENV"

      # KVM for the emulator on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the app in the emulator
        id: drive
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_BIN: ${{ runner.temp }}/qinqin
          E2E_APK: ${{ env.APK }}
          E2E_OUT: ${{ github.workspace }}/apps/android/e2e-out
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 8192M
          force-avd-creation: false
          avd-name: qinqin-e2e
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: node apps/android/e2e/drive.mjs

      - name: Summary
        if: always()
        run: |
          f=apps/android/e2e-out/summary.json
          if [ -f "$f" ]; then
            echo "summary=$(node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))))' "$f")" >> "$GITHUB_OUTPUT"
            {
              echo '### Android emulator run'
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no summary.json: the driver did not run" >> "$GITHUB_STEP_SUMMARY"
          fi
        id: summary
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-emulator
          path: apps/android/e2e-out/
          retention-days: 14
          if-no-files-found: ignore
