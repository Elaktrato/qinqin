# qinqin: one compose file for plain `docker compose up -d`, Portainer (web
# editor, or Repository with compose path docker-compose.yml) and anything else
# that reads standard compose. Step by step: README, "Quick start", and the wiki
# page Admin-deploying (docs/wiki/Admin-deploying.md), "Deploying with Portainer".
#
# UPGRADING from the old quick start: its data lived in ./data. This file now
# defaults to a named volume (qinqin-data), so an old install would start on an
# EMPTY instance. To keep using ./data, set QINQIN_DATA_VOLUME=./data
# (previously ./data; set QINQIN_DATA_VOLUME=./data to keep using it).
#
# First run - the first start installs the bundled packs by itself before it
# listens (about 2 minutes; see QINQIN_AUTO_SEED below). Create the admin
# BEFORE exposing the port beyond your LAN (until a user exists, the first
# registration over the API becomes the admin):
#   docker compose exec qinqin qinqin adduser --username <name> --admin
# or set QINQIN_BOOTSTRAP_ADMIN below. `qinqin seed` is only needed for the
# demo packs, local packs, or re-seeding after an image with newer packs. Set variables in a .env file next to
# this file, in the shell, or (Portainer) in the stack's Environment variables.
#
# Variables:
#   QINQIN_SECRET    optional. 32 random bytes, base64. Generate with
#                      head -c 32 /dev/urandom | base64
#                    Empty or unset = AI features, authenticator apps and a
#                    stored mail password unavailable (the server starts and
#                    the rest works; no weak default key is used). With it,
#                    each user's AI API key, the SMTP password and authenticator
#                    secrets are stored encrypted. Back it up separately from
#                    the data volume; it is never written to /data.
#   QINQIN_IMAGE     default ghcr.io/elaktrato/qinqin:latest. Pin a release,
#                    e.g. ghcr.io/elaktrato/qinqin:v1.2.3 (tags: latest, v*, sha).
#   QINQIN_PORT      published host port, default 8080.
# Backups: users download their data in the app; admins create server backups
#                    (Settings, Admin, Backup) or run `docker exec <c> qinqin backup --out /data/backups/x.tar.gz`.
#                    /data/backups lives in the data volume; bind-mount a host path there to keep archives outside it.
#   QINQIN_DATA_VOLUME  default "qinqin-data" (a named volume, works everywhere,
#                    Portainer included). A value starting with ./ or / is a
#                    bind mount of a host directory instead: ./data (next to
#                    this file; plain compose only, a relative path is
#                    unreliable in Portainer) or an absolute path such as
#                    /srv/qinqin/data. The directory must be writable by root,
#                    the user the image runs as.
#   QINQIN_SECRET_PREVIOUS  only while rotating: the OLD secret, for one restart.
#   QINQIN_AI_PROVIDERS     comma list of the AI providers users may choose:
#                    anthropic, openai, gemini, deepseek, mistral, xai, groq,
#                    openrouter and "custom" (admin-registered endpoints).
#                    Empty = all.
#   QINQIN_AI_ALLOW_PRIVATE "1" lets admin-registered AI endpoints reach
#                    loopback and private addresses (Ollama on your LAN). Off
#                    by default; enable only if you trust every admin.
#   QINQIN_SMTP_ALLOW_PRIVATE "1" lets the mail server be on loopback or a
#                    private network (a relay container, a LAN host).
#   QINQIN_TRUSTED_PROXIES  which peers may tell the server a client's address
#                    through X-Forwarded-For (sign-in limits are per client).
#                    Empty = private networks (right behind a reverse proxy on
#                    a Docker or LAN network). "none" = ignore the header:
#                    set it when NOTHING reverse-proxies to qinqin, because a
#                    client that reaches the port directly could otherwise
#                    forge the header and dodge the per-client limits. Or a
#                    comma list of CIDRs/addresses (a CDN's ranges, one proxy).
#   QINQIN_AUTO_SEED  0, false or off stops the first start from installing the
#                    bundled packs (default on; the demo packs are never
#                    installed this way). See the wiki page Admin-deploying,
#                    "The auto-seed on the first start".
#   QINQIN_BOOTSTRAP_ADMIN  username of the first admin, created on the first
#                    start while the instance has no users (empty = off). The
#                    admin must set a new password at the first sign-in. Later
#                    starts ignore it, so it can stay set or be removed.
#   QINQIN_BOOTSTRAP_PASSWORD  its initial password (10 to 256 characters, not
#                    the username). Empty = a random one is generated and
#                    printed ONCE in the container log (Portainer: Containers,
#                    qinqin, Logs). Remove it from the stack after the first
#                    sign-in. An invalid value stops the server from starting.
#   QINQIN_TESSERACT        path of the tesseract binary; empty = the image's.
#   QINQIN_AI_PROVIDER      "fake" for testing only; never contacts an AI service.
#                    "anthropic" (legacy) means QINQIN_AI_PROVIDERS=anthropic.
services:
  qinqin:
    image: ${QINQIN_IMAGE:-ghcr.io/elaktrato/qinqin:latest}
    restart: unless-stopped
    ports:
      - "${QINQIN_PORT:-8080}:8080"
    volumes:
      - ${QINQIN_DATA_VOLUME:-qinqin-data}:/data
    environment:
      QINQIN_DATA: /data
      QINQIN_SECRET: ${QINQIN_SECRET:-}
      QINQIN_SECRET_PREVIOUS: ${QINQIN_SECRET_PREVIOUS:-}
      QINQIN_AI_PROVIDERS: ${QINQIN_AI_PROVIDERS:-}
      QINQIN_AI_ALLOW_PRIVATE: ${QINQIN_AI_ALLOW_PRIVATE:-}
      QINQIN_SMTP_ALLOW_PRIVATE: ${QINQIN_SMTP_ALLOW_PRIVATE:-}
      QINQIN_AI_PROVIDER: ${QINQIN_AI_PROVIDER:-}
      QINQIN_TRUSTED_PROXIES: ${QINQIN_TRUSTED_PROXIES:-}
      QINQIN_BOOTSTRAP_ADMIN: ${QINQIN_BOOTSTRAP_ADMIN:-}
      QINQIN_BOOTSTRAP_PASSWORD: ${QINQIN_BOOTSTRAP_PASSWORD:-}
      QINQIN_TESSERACT: ${QINQIN_TESSERACT:-}
      QINQIN_AUTO_SEED: ${QINQIN_AUTO_SEED:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start installs the bundled packs before it listens (about
      # 2 minutes measured on a busy dev machine, more on a slow disk); do not
      # count that as unhealthy.
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    # No `user:` and no `read_only:`: the image has no USER (runs as root) and
    # OCR, pack uploads and pack staging write temp files under /tmp.
    # Optional resource caps. Deliberately off: the first-run seed (JMdict,
    # CEDICT, Unihan) and OCR can need more than a guessed limit, and an
    # out-of-memory kill during setup is worse than none. Measure first.
    # mem_limit: 2g
    # cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# With QINQIN_DATA_VOLUME set to a path, Docker treats it as a bind mount and
# the named volume below stays unused (harmless).
volumes:
  qinqin-data:
