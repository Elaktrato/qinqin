# Quick start for plain `docker compose`. The database and installed packs live
# in ./data next to this file. For Portainer (named volume, required
# QINQIN_SECRET, limits) use deploy/portainer-stack.yml instead.
#
# The image also ships the stroke-order data pack; serve installs it at start
# when no strokes pack is installed, and builds the data packages clients
# download into ./data/packages.
#
# First run — seed the sample packs and create the admin user:
#   docker compose exec qinqin qinqin seed
#   docker compose exec qinqin qinqin adduser --username <name> --admin
# Do this BEFORE exposing the port beyond your LAN: until a user exists, the
# first registration over the API becomes the admin — whoever makes it.
services:
  qinqin:
    image: ${QINQIN_IMAGE:-ghcr.io/elaktrato/qinqin:latest}
    restart: unless-stopped
    ports:
      - "${QINQIN_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      QINQIN_DATA: /data
      # AI features (journal review, ideas, photo transcription) store each
      # user's own API key encrypted with this secret. Back it up separately
      # from ./data: without it stored keys cannot be read. It is never
      # written to /data. Leave it unset to keep AI off.
      # QINQIN_SECRET: ${QINQIN_SECRET}  # 32 random bytes, base64: head -c 32 /dev/urandom | base64
      # To rotate: set QINQIN_SECRET to the new value and this to the old one
      # for one restart, then remove it.
      # QINQIN_SECRET_PREVIOUS: ${QINQIN_SECRET_PREVIOUS}
      # Which AI providers users may choose (comma list; default: all):
      # anthropic, openai, gemini, deepseek, mistral, xai, groq, openrouter,
      # and "custom" for endpoints an admin registers in Settings, AI.
      # QINQIN_AI_PROVIDERS: anthropic,openai,gemini,custom
      # WARNING: lets admin-registered AI endpoints reach loopback and your
      # LAN (Ollama on this host or network). Enable only if you trust every
      # admin. Link-local and cloud-metadata addresses stay blocked.
      # QINQIN_AI_ALLOW_PRIVATE: "1"
      # Lets the mail server (Settings, Admin, Email) be on loopback or a private
      # network (a relay container, a LAN host). Metadata addresses stay blocked.
      # QINQIN_SMTP_ALLOW_PRIVATE: "1"
      # Testing only: a fake provider that never contacts any AI service.
      # Who may tell the server a client's address (X-Forwarded-For). Default:
      # private networks, right for a reverse proxy on a Docker/LAN network.
      # Without any reverse proxy in front, set "none" (a direct client could
      # forge the header and dodge the per-client sign-in limits). A comma list
      # of CIDRs or addresses also works (a CDN's ranges).
      # QINQIN_TRUSTED_PROXIES: none
      # Creates the first admin on the first start (while there are no users)
      # and makes it set a new password at the first sign-in, instead of
      # `qinqin adduser`. Without the password a random one is generated and
      # printed once in the container log (docker compose logs qinqin). Later
      # starts ignore both; an invalid value stops the server from starting.
      # QINQIN_BOOTSTRAP_ADMIN: you
      # QINQIN_BOOTSTRAP_PASSWORD: choose-a-long-initial-password
      # Path of the tesseract binary (default: the image's).
      # QINQIN_TESSERACT: /usr/bin/tesseract
      # QINQIN_AI_PROVIDER: fake
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
